# Reverse proxy of Aurelius on pyatlas: serves the Angular frontend and routes the API calls.
# Upstreams come from the environment (docker-compose): PYATLAS_URL, KEYCLOAK_URL; NAMESPACE is fixed at build time.
ServerRoot "/usr/local/apache2"
Listen 8080
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_openidc_module modules/mod_auth_openidc.so

User www-data
Group www-data
ErrorLog /proc/self/fd/2
LogLevel warn
# one JSON object per request with the tenant (from the URL path, the realm of a Keycloak or Kibana request); the log
# shipper routes it to logs-aurelius.proxy-<tenant>
LogFormat "{\"tenant\":\"%{AURELIUS_TENANT}e\",\"client\":{\"ip\":\"%a\"},\"method\":\"%m\",\"path\":\"%U\",\"status\":%>s,\"bytes\":%B,\"duration_ms\":%{ms}T,\"user\":\"%{OIDC_CLAIM_preferred_username}e\",\"user_agent\":{\"original\":\"%{User-Agent}i\"}}" aurelius_json
CustomLog /proc/self/fd/1 aurelius_json
TypesConfig conf/mime.types
AddType application/manifest+json .webmanifest
AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
ServerTokens Prod
ServerSignature Off
TraceEnable Off
RequestHeader unset Proxy early

<Directory />
    AllowOverride None
    Require all denied
</Directory>

Include conf.d/aurelius.conf
