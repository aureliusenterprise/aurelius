# Routes of Aurelius on pyatlas, one set of containers for several tenants.
#   /<ns>/<tenant>/atlas/                 the Angular frontend (apps/atlas), the same files for every tenant
#   /<ns>/<tenant>/atlas/config.json      realm of the tenant for the frontend  -> pyatlas /api/aurelius/frontend-config
#   /<ns>/<tenant>/atlas/atlas/           Atlas v2 REST API                     -> pyatlas /api/atlas/
#   /<ns>/<tenant>/atlas/repository/api/  clickstream and error reports         -> pyatlas /api/aurelius/repository/
#   /<ns>/<tenant>/atlas/elastic, data_quality, gov_quality, validate_entity, lineage_model, classifications,
#                        dataset_overview (-> /api/aurelius/datasets),
#                        api/data_governance_dashboard                          -> pyatlas /api/aurelius/...
#   /<ns>/<tenant>/lin_api/               lineage registration API              -> pyatlas /api/lin_api/
#   /<ns>/<tenant>/atlas2/                pyatlas itself (Atlas UIs, Swagger at .../atlas2/api/docs)
#   /<ns>/<tenant>/kibana/                -> /<ns>/kibana/s/<tenant>/: the tenant's Kibana space (kibana-tenants.conf)
#   /<ns>/auth/                           Keycloak, one realm per tenant: /<ns>/auth/realms/<tenant>
#   /<ns>/atlas/, /<ns>/lin_api/, ...     the old single-tenant URLs: the default tenant (DEFAULT_TENANT)
#
# The tenant comes from the URL path only.  The proxy removes any X-Aurelius-Tenant header the client sent and sets
# its own; pyatlas believes that header only from the proxy (PYATLAS_TRUSTED_PROXIES).  Unknown tenants get 404
# from pyatlas; a new tenant needs no change here.
# the first path segment of every URL (the Kubernetes namespace in the Helm chart), from the environment
Define NS ${AURELIUS_NS}
Define TENANT "[a-z][a-z0-9-]{1,30}[a-z0-9]"

ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 300
# the scheme the browser used: from the ingress in front (TLS ends there), else this server's own
RequestHeader setifempty X-Forwarded-Proto "https" "expr=%{HTTPS} == 'on'"
RequestHeader setifempty X-Forwarded-Proto "http"

# the tenant header is the proxy's alone
RequestHeader unset X-Aurelius-Tenant early
RequestHeader set X-Aurelius-Tenant "%{AURELIUS_TENANT}e" env=AURELIUS_TENANT

# security headers on every answer (Keycloak and Kibana add their own CSP)
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"
# request bodies: import ZIPs up to pyatlas' limit (512 MB)
LimitRequestBody 536870912

# Keycloak's metrics and health endpoints are for the containers, not for the browser
<LocationMatch "^/${NS}/auth/(metrics|health)">
    Require all denied
</LocationMatch>

# logins at a realm are requests of that tenant (proxy log)
SetEnvIf Request_URI "^/${NS}/auth/realms/([a-z][a-z0-9-]{1,30}[a-z0-9])/" AURELIUS_TENANT=$1
ProxyPass        "/${NS}/auth/" "${KEYCLOAK_URL}/${NS}/auth/"
ProxyPassReverse "/${NS}/auth/" "${KEYCLOAK_URL}/${NS}/auth/"

RewriteEngine On

# ---- old single-tenant URLs -> the default tenant --------------------------------------------------------------
RewriteRule "^/?$"                "/${NS}/${DEFAULT_TENANT}/atlas/" [R=302,L]
RewriteRule "^/${NS}/?$"          "/${NS}/${DEFAULT_TENANT}/atlas/" [R=302,L]
# pages of the frontend: the browser moves to the tenant URL (bookmarks keep working)
RewriteCond "$1" "!^(atlas/|repository/|elastic|data_quality|gov_quality|validate_entity|lineage_model|classifications|dataset_overview|api/)"
RewriteRule "^/${NS}/atlas(?:/(.*))?$" "/${NS}/${DEFAULT_TENANT}/atlas/$1" [R=302,NE,L]
# API calls of scripts and pipelines: served for the default tenant without a redirect (POST stays POST)
RewriteRule "^/${NS}/(atlas|atlas2|lin_api)/(.*)$" "/${NS}/${DEFAULT_TENANT}/$1/$2"

# ---- tenant routes ---------------------------------------------------------------------------------------------
RewriteRule "^/${NS}/(${TENANT})/atlas$" "/${NS}/$1/atlas/" [R=302,L]
RewriteRule "^/${NS}/(${TENANT})/atlas/atlas/(.*)$" "${PYATLAS_URL}/api/atlas/$2" [P,NE,E=AURELIUS_TENANT:$1]
RewriteRule "^/${NS}/(${TENANT})/atlas/config\.json$" "${PYATLAS_URL}/api/aurelius/frontend-config" [P,E=AURELIUS_TENANT:$1]
RewriteRule "^/${NS}/(${TENANT})/atlas/repository/api/(.*)$" "${PYATLAS_URL}/api/aurelius/repository/$2" [P,NE,E=AURELIUS_TENANT:$1]
RewriteRule "^/${NS}/(${TENANT})/atlas/elastic(.*)$" "${PYATLAS_URL}/api/aurelius/search/atlas-dev$2" [P,NE,E=AURELIUS_TENANT:$1]
RewriteRule "^/${NS}/(${TENANT})/atlas/data_quality(.*)$" "${PYATLAS_URL}/api/aurelius/search/atlas-dev-quality$2" [P,NE,E=AURELIUS_TENANT:$1]
RewriteRule "^/${NS}/(${TENANT})/atlas/gov_quality(.*)$" "${PYATLAS_URL}/api/aurelius/search/atlas-dev-gov-quality$2" [P,NE,E=AURELIUS_TENANT:$1]
RewriteRule "^/${NS}/(${TENANT})/atlas/classifications(.*)$" "${PYATLAS_URL}/api/aurelius/classifications$2" [P,NE,E=AURELIUS_TENANT:$1]
RewriteRule "^/${NS}/(${TENANT})/atlas/dataset_overview/(.*)$" "${PYATLAS_URL}/api/aurelius/datasets/$2" [P,NE,E=AURELIUS_TENANT:$1]
RewriteRule "^/${NS}/(${TENANT})/atlas/(validate_entity|lineage_model)(.*)$" "${PYATLAS_URL}/api/aurelius/$2$3" [P,NE,E=AURELIUS_TENANT:$1]
RewriteRule "^/${NS}/(${TENANT})/atlas/api/data_governance_dashboard(.*)$" "${PYATLAS_URL}/api/aurelius/data_governance_dashboard$2" [P,NE,E=AURELIUS_TENANT:$1]
RewriteRule "^/${NS}/(${TENANT})/lin_api/(.*)$" "${PYATLAS_URL}/api/lin_api/$2" [P,NE,E=AURELIUS_TENANT:$1]
RewriteRule "^/${NS}/(${TENANT})/atlas2/(.*)$" "${PYATLAS_URL}/$2" [P,NE,E=AURELIUS_TENANT:$1]
# the frontend: the same files for every tenant; unknown paths are pages of the single-page app
RewriteCond "/usr/local/apache2/atlas/$2" -f
RewriteRule "^/${NS}/(${TENANT})/atlas/(.+)$" "/usr/local/apache2/atlas/$2" [L,E=AURELIUS_TENANT:$1]
RewriteRule "^/${NS}/(${TENANT})/atlas/" "/usr/local/apache2/atlas/index.html" [L,E=AURELIUS_TENANT:$1]

<Directory "/usr/local/apache2/atlas">
    Require all granted
    Options FollowSymLinks
    # the app shell must never be cached, the hashed bundles can be cached for long
    <FilesMatch "\.(js|css|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</Directory>

# ---- Kibana: a space per tenant, behind the tenant's Keycloak login ----------------------------------------------
Include conf.d/kibana-tenants.conf
