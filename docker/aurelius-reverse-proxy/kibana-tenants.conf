# Kibana for several tenants: one Kibana, a space per tenant (id = tenant id), at /<ns>/kibana/s/<tenant>/.
#
#  * Login: the user logs in at the Keycloak realm of the tenant (mod_auth_openidc with one provider per realm,
#    OIDCMetadataDir, written by "aurelius-admin tenant create").  Which realm: pyatlas' discovery endpoint takes the
#    tenant from the URL the user asked for (/<ns>/<tenant>/kibana/ or /<ns>/kibana/s/<tenant>/...).
#  * Authorisation: realm role ROLE_ADMIN of that realm.
#  * The tenant of a request is the realm that issued the user's login (never a URL or header of the browser); the
#    proxy forwards the request to Kibana with that tenant's Kibana API key (tenants/kibana-keys.txt, "tenant key").
#    The key's role can only open the tenant's space and read the tenant's indices and log data streams, so a user
#    of acme who types /s/beta/ gets Kibana's "no access" page.
#  * Opening another tenant's space: the login of the first tenant does not fit; the proxy ends it and the user logs
#    in at the other tenant's realm.
OIDCMetadataDir                    "${TENANTS_DIR}/oidc"
OIDCDiscoverURL                    "/${NS}/kibana-discover"
OIDCRedirectURI                    "/${NS}/kibana-oidc/callback"
OIDCCryptoPassphrase               "${PROXY_CRYPTO_PASSPHRASE}"
OIDCScope                          "openid"
OIDCRemoteUserClaim                preferred_username
OIDCCookiePath                     "/${NS}/"
OIDCSessionInactivityTimeout       1800
# claims as environment variables only (never as headers to Kibana)
OIDCPassClaimsAs                   environment
# logged in, but not ROLE_ADMIN of the tenant: 403 (no new login, it would find the same session at Keycloak)
OIDCUnAutzAction                   403
# the login session is the proxy's business, Kibana never sees it
OIDCStripCookies                   mod_auth_openidc_session mod_auth_openidc_session_chunks mod_auth_openidc_session_0 mod_auth_openidc_session_1 mod_auth_openidc_session_2

RewriteMap kibanakeys "txt:${TENANTS_DIR}/kibana-keys.txt"
RewriteMap urlescape "int:escape"

# which realm to log in to: pyatlas answers with a redirect to the realm of the tenant in target_link_uri
ProxyPass "/${NS}/kibana-discover" "${PYATLAS_URL}/api/aurelius/kibana-discover"

<Location "/${NS}/kibana-oidc/">
    AuthType openid-connect
    Require valid-user
</Location>

# the tenant URL of Kibana opens the tenant's space
RewriteRule "^/${NS}/(${TENANT})/kibana/?$" "/${NS}/kibana/s/$1/app/dashboards" [R=302,L]
RewriteRule "^/${NS}/kibana$" "/${NS}/kibana/" [R=302,L]

<Location "/${NS}/kibana/">
    AuthType openid-connect
    <RequireAll>
        Require claim roles:ROLE_ADMIN
        Require valid-user
    </RequireAll>
    ProxyPass        "${KIBANA_URL}/${NS}/kibana/"
    ProxyPassReverse "${KIBANA_URL}/${NS}/kibana/"
    # tenant = realm that issued the login; its Kibana API key replaces whatever the browser sent
    RewriteEngine On
    # not logged in yet: mod_auth_openidc's discovery (content handler) takes over, nothing is forwarded
    RewriteCond "%{REMOTE_USER}" "^$"
    RewriteRule ".*" "-" [L]
    RewriteCond "%{ENV:OIDC_CLAIM_iss}" "/realms/([a-z][a-z0-9-]{1,30}[a-z0-9])$"
    RewriteRule ".*" "-" [E=KIBANA_TENANT:%1,E=AURELIUS_TENANT:%1]
    RewriteCond "%{ENV:KIBANA_TENANT}" "^(.+)$"
    RewriteRule ".*" "-" [E=KIBANA_KEY:${kibanakeys:%1|none}]
    RewriteCond "%{ENV:KIBANA_KEY}" "^(none)?$"
    RewriteRule ".*" "-" [F]
    # the space of another tenant: the current login does not fit - end it (locally) and come back, which starts a
    # login at the realm of that tenant (the space is never passed on with this tenant's key)
    RewriteCond "%{REQUEST_URI}" "^/${NS}/kibana/s/([^/]+)"
    RewriteCond "%1<>%{ENV:KIBANA_TENANT}" "!^(.+)<>\1$"
    RewriteRule ".*" "-" [E=KIBANA_RETURN:${PUBLIC_URL}%{REQUEST_URI}]
    RewriteCond "%{REQUEST_URI}" "^/${NS}/kibana/s/([^/]+)"
    RewriteCond "%1<>%{ENV:KIBANA_TENANT}" "!^(.+)<>\1$"
    RewriteRule ".*" "/${NS}/kibana-oidc/callback?logout=${urlescape:%{ENV:KIBANA_RETURN}}" [R=302,L]
    RequestHeader set Authorization "ApiKey %{KIBANA_KEY}e"
</Location>

