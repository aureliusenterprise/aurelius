name: aurelius-frontend-example-e2e

services:
    aurelius-frontend-example:
        image: aurelius-frontend-example:local
        depends_on:
            aurelius-fastapi-example:
                condition: service_healthy
            keycloak:
                condition: service_healthy
        environment:
            AURELIUS_BACKEND_URL: http://aurelius-fastapi-example:8000
            KEYCLOAK_CLIENT_ID: ${AUTH_CLIENT_ID}
            KEYCLOAK_REALM: ${AUTH_REALM_NAME}
            KEYCLOAK_URL: http://localhost:8180
        ports:
            - 80

    aurelius-fastapi-example:
        image: aurelius-fastapi-example:local
        depends_on:
            postgres-app:
                condition: service_healthy
            keycloak:
                condition: service_healthy
        environment:
            AUTH_REALM_NAME: ${AUTH_REALM_NAME}
            AUTH_SERVER_URL: http://keycloak:8180
            DATABASE_NAME: ${DATABASE_NAME}
            DATABASE_HOST: postgres-app
            DATABASE_PASSWORD: ${DATABASE_PASSWORD}
            DATABASE_PORT: ${DATABASE_PORT}
            DATABASE_USERNAME: ${DATABASE_USERNAME}
            ENVIRONMENT: ${ENVIRONMENT}
            LOG_LEVEL: ${LOG_LEVEL}
        ports:
            - 8000

    keycloak:
        image: keycloak/keycloak:latest
        command: ["start-dev", "--http-port=8180", "--import-realm"]
        depends_on:
            postgres-keycloak:
                condition: service_healthy
        environment:
            KC_BOOTSTRAP_ADMIN_PASSWORD: ${PASSWORD}
            KC_BOOTSTRAP_ADMIN_USERNAME: ${USERNAME}
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
            KC_DB_USERNAME: ${DATABASE_USERNAME}
            KC_DB_PASSWORD: ${DATABASE_PASSWORD}
            KC_HEALTH_ENABLED: true
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
                ]
            interval: 30s
            timeout: 5s
            retries: 10
        ports:
            - 8180:8180
        volumes:
            - ../../../dev/keycloak/import:/opt/keycloak/data/import:ro

    postgres-app:
        image: postgres:latest
        environment:
            POSTGRES_USER: ${DATABASE_USERNAME}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
            POSTGRES_DB: ${DATABASE_NAME}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready", "-d", "${DATABASE_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - 5432

    postgres-keycloak:
        image: postgres:latest
        environment:
            POSTGRES_USER: ${DATABASE_USERNAME}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
            POSTGRES_DB: keycloak
        healthcheck:
            test: ["CMD-SHELL", "pg_isready", "-d", "keycloak"]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - 5432
