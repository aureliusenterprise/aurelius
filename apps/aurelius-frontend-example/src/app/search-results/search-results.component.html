@let entities = searchService.entities();

<h1 class="title is-1">Welcome!</h1>
<div class="subtitle is-3">I have found {{ entities.length | i18nPlural: pluralMap }}</div>

<section class="section px-0">
    <div class="grid is-col-min-15">
        @for (entity of entities; track entity.guid) {
            <aurelius-ui-card class="cell">
                <ng-container card-content>
                    <p class="title is-4">{{ entity.name }}</p>
                    <div class="content">{{ entity.description }}</div>
                </ng-container>
                <ng-container card-footer>
                    <nav class="card-footer-item level is-mobile">
                        <div class="level-left"></div>
                        <div class="level-right has-text-right">
                            <div class="level-item">
                                <button
                                    class="button is-info is-inverted is-small"
                                    (click)="entityService.edit(entity)"
                                >
                                    <span class="icon is-small"><fa-icon [icon]="faEdit"></fa-icon></span>
                                </button>
                            </div>
                        </div>
                    </nav>
                </ng-container>
            </aurelius-ui-card>
        }
    </div>
</section>
