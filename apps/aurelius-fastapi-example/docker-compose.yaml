name: aurelius-fastapi-example

services:
    aurelius-fastapi-example:
        image: aurelius-fastapi-example:latest
        environment:
            LOG_LEVEL: ${LOG_LEVEL}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_HOST: postgres-e2e
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_PORT: 5432
            POSTGRES_USER: ${POSTGRES_USER}
        ports:
            - 8000
        profiles:
            - e2e

    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - ${POSTGRES_PORT}:${POSTGRES_PORT}
        profiles:
            - backend
        volumes:
            - postgres_data:/var/lib/postgresql/data

    postgres-e2e:
        image: postgres:latest
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - 5432
        profiles:
            - e2e

volumes:
    postgres_data:
