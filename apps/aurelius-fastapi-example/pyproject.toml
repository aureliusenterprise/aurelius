[project]
dependencies = [
    "aurelius-example",
    "aurelius-sdk[postgresql]",
    "cachetools>=6.2.2",
    "cryptography>=46.0.7",
    "fastapi>=0.136",
    "httpx>=0.28",
    "logfire[fastapi,httpx,psycopg]>=4.32",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "pyjwt>=2.12",
    "uvicorn[standard]>=0.46",
]
description = "This is an example FastAPI application."
name = "aurelius-fastapi-example"
requires-python = ">=3.14"
version = "0.6.0"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_fastapi_example"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[tool.uv.sources.aurelius-example]
workspace = true

[tool.uv.sources.aurelius-sdk]
workspace = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
