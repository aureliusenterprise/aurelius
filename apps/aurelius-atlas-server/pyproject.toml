[project]
dependencies = [
    "aurelius-atlas-store-es",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]
description = "Aurelius Atlas server: the Apache Atlas REST API on Elasticsearch 9."
name = "aurelius-atlas-server"
requires-python = ">=3.14"
version = "0.6.0"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_server"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[tool.coverage.run]
branch = true

[tool.uv.sources.aurelius-atlas-store-es]
workspace = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
