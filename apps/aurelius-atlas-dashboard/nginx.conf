# Serves the Atlas dashboards and forwards the Atlas API to the server (DD-010).
# The upstream name is the server's service name on the shared Docker network.
upstream aurelius_atlas_server {
    server aurelius-atlas-server:21000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The Atlas REST API (both dashboards call /api/atlas/..., dashboardv3 strips its /n prefix).
    location /api/ {
        proxy_pass http://aurelius_atlas_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    location = /n {
        return 301 /n/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
