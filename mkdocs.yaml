copyright: © 2025 Aurelius Enterprise
repo_name: project-template
repo_url: https://github.com/aureliusenterprise/project-template
site_name: Aurelius Project Template
site_url: https://aureliusenterprise.github.io/project-template

theme:
    favicon: assets/favicon.ico
    logo: assets/favicon.ico
    name: material
    search: true

    features:
        - content.code.copy
        - navigation.indexes
        - navigation.instant
        - navigation.instant.progress
        - navigation.path
        - navigation.sections
        - navigation.tabs
        - search.highlight

    icon:
        repo: fontawesome/brands/github

    palette:
        - media: "(prefers-color-scheme)"
          accent: deep purple
          toggle:
              icon: material/brightness-auto
              name: Switch to light mode
        - media: "(prefers-color-scheme: light)"
          accent: deep purple
          scheme: default
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          accent: deep purple
          scheme: slate
          toggle:
              icon: material/brightness-4
              name: Switch to system preference

markdown_extensions:
    - admonition
    - attr_list
    - codehilite
    - md_in_html
    - pymdownx.details
    - pymdownx.snippets
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.snippets
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.tasklist:
          clickable_checkbox: true
          custom_checkbox: true
    - toc:
          permalink: true

nav:
    - User Guide:
          - user-guide/index.md
          - Design Guide:
                - user-guide/design-guide/index.md
                - Consumers: user-guide/design-guide/consumers.md
                - Producers: user-guide/design-guide/producers.md
                - Kafka Topics: user-guide/design-guide/kafka-topics.md
                - Schemas: user-guide/design-guide/schemas.md
    - Contributor Guide:
          - contributor-guide/index.md
          - Development Environment: contributor-guide/development-environment.md
          - Documentation: contributor-guide/documentation.md
          - Secrets Management: contributor-guide/secrets-management.md
          - Version Control: contributor-guide/version-control.md
    - API Reference:
          - api-reference/index.md
          - Apps:
                - api-reference/apps/index.md
                - aurelius-aws-lambda-example: api-reference/apps/aurelius-aws-lambda-example.md
                - aurelius-fastapi-example: api-reference/apps/aurelius-fastapi-example.md
                - aurelius-java-producer-example: api-reference/apps/aurelius-java-producer-example.md
                - aurelius-node-red-example: api-reference/apps/aurelius-node-red-example.md
          - Connectors:
                - api-reference/connectors/index.md
                - aurelius-kafka-connect-jdbc-sink-example: api-reference/connectors/aurelius-kafka-connect-jdbc-sink-example.md
          - Docker:
                - api-reference/docker/index.md
                - aurelius-aws-lambda-base: api-reference/docker/aurelius-aws-lambda-base.md
                - aurelius-kafka-connect-base: api-reference/docker/aurelius-kafka-connect-base.md
                - aurelius-kafka-connect-jdbc-sink-base: api-reference/docker/aurelius-kafka-connect-jdbc-sink-base.md
          - Libs:
                - api-reference/libs/index.md
                - Python:
                      - api-reference/libs/python/index.md
                      - aurelius-aws-lambda: api-reference/libs/python/aurelius-aws-lambda.md
                      - aurelius-example: api-reference/libs/python/aurelius-example.md
                      - aurelius-kafka: api-reference/libs/python/aurelius-kafka.md
                      - aurelius-sdk: api-reference/libs/python/aurelius-sdk.md
    - Architecture:
          - architecture/index.md
          - Vision & Strategy:
                - architecture/vision-and-strategy/index.md
                - Mission Statement: architecture/vision-and-strategy/mission-statement.md
                - Business Objectives: architecture/vision-and-strategy/business-objectives.md
                - Stakeholder Analysis: architecture/vision-and-strategy/stakeholder-analysis.md
                - Architecture Roadmap: architecture/vision-and-strategy/architecture-roadmap.md
          - Data Lifecycle Management:
                - architecture/data-lifecycle-management/index.md
                - Data Collection: architecture/data-lifecycle-management/data-collection.md
                - Data Storage: architecture/data-lifecycle-management/data-storage.md
                - Data Processing: architecture/data-lifecycle-management/data-processing.md
                - Data Sharing: architecture/data-lifecycle-management/data-sharing.md
                - Data Archiving: architecture/data-lifecycle-management/data-archiving.md
          - Data Governance:
                - architecture/data-governance/index.md
                - Roles & Responsibilities: architecture/data-governance/roles-and-responsibilities.md
                - Data Dictionary: architecture/data-governance/data-dictionary.md
                - Data Quality: architecture/data-governance/data-quality.md
                - Data Lineage: architecture/data-governance/data-lineage.md
                - Compliance & Auditability: architecture/data-governance/compliance-and-auditability.md
          - Platform:
                - architecture/platform/index.md
                - Components & Interfaces: architecture/platform/components-and-interfaces.md
                - Data Pipelines: architecture/platform/data-pipelines.md
                - Connectivity:
                      - architecture/platform/connectivity/index.md
                      - Integration Methods: architecture/platform/connectivity/integration-methods.md
                      - API Management: architecture/platform/connectivity/api-management.md
                      - Networking: architecture/platform/connectivity/networking.md
                - Delivery:
                      - architecture/platform/delivery/index.md
                      - Configuration Management: architecture/platform/delivery/configuration-management.md
                      - Change Management: architecture/platform/delivery/change-management.md
                      - Testing: architecture/platform/delivery/testing.md
                      - Release Management: architecture/platform/delivery/release-management.md
                      - Deployment: architecture/platform/delivery/deployment.md
                - Observability:
                      - architecture/platform/observability/index.md
                      - Monitoring: architecture/platform/observability/monitoring.md
                      - Logging: architecture/platform/observability/logging.md
                      - Alerting: architecture/platform/observability/alerting.md
                - Resilience:
                      - architecture/platform/resilience/index.md
                      - High Availability: architecture/platform/resilience/high-availability.md
                      - Incident Management: architecture/platform/resilience/incident-management.md
                      - Backup & Restore: architecture/platform/resilience/backup-and-restore.md
                      - Disaster Recovery: architecture/platform/resilience/disaster-recovery.md
                - Security:
                      - architecture/platform/security/index.md
                      - Access Management: architecture/platform/security/access-management.md
                      - Identity Management: architecture/platform/security/identity-management.md
                      - Secrets Management: architecture/platform/security/secrets-management.md
                      - Data Encryption: architecture/platform/security/data-encryption.md
    - Changelog: CHANGELOG.md

plugins:
    - autorefs
    - mike
    - mkdocstrings:
          handlers:
              python:
                  options:
                      show_root_heading: true
                      show_object_full_path: false
                      show_symbol_type_heading: true
                      show_symbol_type_toc: true
                      show_signature: true
                      separate_signature: true
                      show_signature_annotations: true
                      signature_crossrefs: true
                      show_source: false
                      show_if_no_docstring: true
                      show_docstring_examples: true
    - search
    - tags
    - print-site

extra:
    generator: false
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/aureliusenterprise/project-template
    version:
        alias: true
        provider: mike

extra_css:
    - stylesheets/table.css
