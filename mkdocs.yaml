                      - 0.1 Adopt the template: architecture/conversion/increments/0-1-adopt-template.md
                      - 0.2 Elasticsearch infrastructure: architecture/conversion/increments/0-2-elasticsearch.md
                      - 0.3 Test report and traceability: architecture/conversion/increments/0-3-test-report.md
          - Vision & Strategy:
