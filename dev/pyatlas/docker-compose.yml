# Aurelius on pyatlas (phase 1): reverse proxy with the Angular frontend, Keycloak, pyatlas, Elasticsearch.
#   docker compose -f dev/pyatlas/docker-compose.yml up --build        (or start.bat in this folder)
# Frontend: http://localhost:9090/aurelius/atlas/   users atlas / steward / scientist (password = user name,
#           change with AURELIUS_ATLAS_PASSWORD, AURELIUS_STEWARD_PASSWORD, AURELIUS_SCIENTIST_PASSWORD on first start)
# Keycloak admin console: http://localhost:9090/aurelius/auth/admin/   (KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD)
# pyatlas directly (Atlas UIs, Swagger): http://localhost:9090/aurelius/atlas2/   (the same Keycloak users)
# Secrets: start.bat / init-env.sh write random ones to .env on the first start (KEYCLOAK_ADMIN_PASSWORD,
# PYATLAS_SESSION_SECRET, AURELIUS_PROXY_CLIENT_SECRET, AURELIUS_PROXY_CRYPTO_PASSPHRASE); compose refuses to
# start without them.
# Kibana: http://localhost:9090/aurelius/kibana/   (Keycloak login, ROLE_ADMIN only - user atlas; data views for the
#         Atlas and Aurelius indices are created at start)
# Everything is reached through http://localhost:9090; to use another host name set AURELIUS_PUBLIC_URL
# (e.g. https://aurelius.example.com) - it must be the URL the browser uses.
name: aurelius-pyatlas

x-public-url: &public ${AURELIUS_PUBLIC_URL:-http://localhost:9090}
# container logs are rotated (default json-file driver grows without limit)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - esdata9:/usr/share/elasticsearch/data
    # without security: reachable from this machine only (Kibana and pyatlas use the internal network)
    ports:
      - "127.0.0.1:9200:9200"
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      retries: 30

  # Kibana behind the reverse proxy: http://localhost:9090/aurelius/kibana/ (Keycloak login, realm role ROLE_ADMIN)
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TELEMETRY_OPTIN=false
      - SERVER_BASEPATH=/aurelius/kibana
      - SERVER_REWRITEBASEPATH=true
      - SERVER_PUBLICBASEURL=${AURELIUS_PUBLIC_URL:-http://localhost:9090}/aurelius/kibana
    restart: unless-stopped
    logging: *logging

  # one-off job: Kibana data views for the pyatlas and Aurelius indices (backend/pyatlas/docker/kibana-setup.sh)
  kibana-setup:
    image: curlimages/curl:8.10.1
    depends_on:
      - kibana
    environment:
      - KIBANA_URL=http://kibana:5601/aurelius/kibana
      - INDEX_PREFIX=atlas
    volumes:
      - ../../backend/pyatlas/docker/kibana-setup.sh:/kibana-setup.sh:ro
      - ../../backend/pyatlas/docker/kibana-dashboards.ndjson:/kibana-dashboards.ndjson:ro
    entrypoint: ["sh", "-c", "tr -d '\\r' < /kibana-setup.sh | sh"]
    restart: "no"

  keycloak:
    build:
      context: ../..
      dockerfile: docker/aurelius-docker-keycloak/Dockerfile      # Keycloak 22.0.5 with the Aurelius theme
    image: aurelius-keycloak:local
    pull_policy: build
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run start.bat or init-env.sh to create .env}
      KC_HTTP_PORT: "8080"
      KC_HTTP_RELATIVE_PATH: /aurelius/auth
      KC_HOSTNAME_URL: ${AURELIUS_PUBLIC_URL:-http://localhost:9090}/aurelius/auth
      KC_HOSTNAME_ADMIN_URL: ${AURELIUS_PUBLIC_URL:-http://localhost:9090}/aurelius/auth
      KC_PROXY: edge
      KC_HEALTH_ENABLED: "true"
      # read by the realm file on its first import
      AURELIUS_PUBLIC_URL: *public
      AURELIUS_ATLAS_PASSWORD: ${AURELIUS_ATLAS_PASSWORD:-atlas}
      AURELIUS_STEWARD_PASSWORD: ${AURELIUS_STEWARD_PASSWORD:-steward}
      AURELIUS_SCIENTIST_PASSWORD: ${AURELIUS_SCIENTIST_PASSWORD:-scientist}
    volumes:
      - ./keycloak/realm-m4i.json:/opt/keycloak/data/import/realm-m4i.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /aurelius/auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      retries: 30
    restart: unless-stopped
    logging: *logging

  # one-off job: the confidential client the reverse proxy uses for the Kibana login (idempotent)
  keycloak-init:
    build:
      context: ../..
      dockerfile: docker/aurelius-docker-keycloak/Dockerfile
    image: aurelius-keycloak:local
    pull_policy: build
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["bash", "/ensure-proxy-client.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080/aurelius/auth
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run start.bat or init-env.sh to create .env}
      PROXY_CLIENT_SECRET: ${AURELIUS_PROXY_CLIENT_SECRET:?run start.bat or init-env.sh to create .env}
      PUBLIC_URL: *public
    volumes:
      - ./keycloak/ensure-proxy-client.sh:/ensure-proxy-client.sh:ro
    restart: "no"

  pyatlas:
    build:
      context: ../..
      dockerfile: backend/pyatlas/Dockerfile
    image: pyatlas:local
    pull_policy: build
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - PYATLAS_ES_HOSTS=http://elasticsearch:9200
      - PYATLAS_SESSION_SECRET=${PYATLAS_SESSION_SECRET:?run start.bat or init-env.sh to create .env}
      # only Keycloak users (the image's users file with admin/admin is not used); scripts log in with a Keycloak
      # user (Basic auth, checked by Keycloak) or a Keycloak token
      - PYATLAS_FILE_USERS_ENABLED=false
      # tokens of the frontend's client only (add the clients of service accounts, comma separated)
      - PYATLAS_OIDC_CLIENTS=${PYATLAS_OIDC_CLIENTS:-m4i_atlas}
      # the reverse proxy in the compose network: its X-Forwarded-For gives the browser's address
      - PYATLAS_TRUSTED_PROXIES=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      # Keycloak tokens of the frontend: the issuer is the public URL, the keys are fetched inside the network
      - PYATLAS_OIDC_ENABLED=true
      - PYATLAS_OIDC_ISSUERS=${AURELIUS_PUBLIC_URL:-http://localhost:9090}/aurelius/auth/realms/m4i
      - PYATLAS_OIDC_JWKS_URL=http://keycloak:8080/aurelius/auth/realms/m4i/protocol/openid-connect/certs
      # Keycloak users can also log in to the Atlas UIs at /aurelius/atlas2/ (password checked by Keycloak)
      - PYATLAS_OIDC_PASSWORD_LOGIN=true
      # the Aurelius sample data on the first start (set PYATLAS_IMPORT_ON_START= to start empty)
      - PYATLAS_IMPORT_ON_START=${PYATLAS_IMPORT_ON_START-/aurelius-data/sample_data.zip}
      - PYATLAS_IMPORT_ON_START_MODE=once
      # sample data quality results (the golden file of the Aurelius post-install job); governance quality is
      # computed by pyatlas; real results come from the quality tooling via POST /api/aurelius/quality/results
      - PYATLAS_AURELIUS_QUALITY_SEED=${PYATLAS_AURELIUS_QUALITY_SEED-/aurelius-data/atlas-dev-quality.json}
    volumes:
      - ../../backend/m4i-atlas-post-install/data:/aurelius-data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:21000/api/atlas/admin/liveness', timeout=5)"]
      interval: 15s
      retries: 20
    restart: unless-stopped
    logging: *logging

  reverse-proxy:
    build:
      context: ../..
      dockerfile: dev/pyatlas/reverse-proxy/Dockerfile
    image: aurelius-reverse-proxy:local
    pull_policy: build
    depends_on:
      - pyatlas
      - keycloak
      - kibana
    environment:
      - PYATLAS_URL=http://pyatlas:21000
      - KEYCLOAK_URL=http://keycloak:8080
      - KIBANA_URL=http://kibana:5601
      - PUBLIC_URL=${AURELIUS_PUBLIC_URL:-http://localhost:9090}
      - PROXY_CLIENT_SECRET=${AURELIUS_PROXY_CLIENT_SECRET:?run start.bat or init-env.sh to create .env}
      - PROXY_CRYPTO_PASSPHRASE=${AURELIUS_PROXY_CRYPTO_PASSPHRASE:?run start.bat or init-env.sh to create .env}
    ports:
      - "9090:8080"            # browser port 9090 -> proxy port 8080 in the container
    restart: unless-stopped
    logging: *logging

volumes:
  esdata9:
  keycloak-data:
