# Routes of Aurelius on pyatlas (replaces k8s/charts/reverse-proxy/conf.d for this stack).
#   /<ns>/atlas/            the Angular frontend (apps/atlas)
#   /<ns>/atlas/atlas/      Atlas v2 REST API             -> pyatlas /api/atlas/
#   /<ns>/atlas/repository/api/  clickstream and error reports -> pyatlas /api/aurelius/repository/
#   /<ns>/atlas/elastic, data_quality, gov_quality          -> pyatlas App Search compatible search (phase 2)
#   /<ns>/atlas/validate_entity, lineage_model, lineage, api/data_governance_dashboard -> pyatlas (phases 3-4)
#   /<ns>/atlas2/           pyatlas itself (Atlas UIs, Swagger at /<ns>/atlas2/api/docs)
#   /<ns>/auth/             Keycloak
Define NS aurelius

ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 300
RequestHeader set X-Forwarded-Proto "http" "expr=%{HTTPS} != 'on'"
RequestHeader set X-Forwarded-Proto "https" "expr=%{HTTPS} == 'on'"

RedirectMatch 302 "^/$" "/${NS}/atlas/"
RedirectMatch 302 "^/${NS}/?$" "/${NS}/atlas/"
RedirectMatch 302 "^/${NS}/atlas$" "/${NS}/atlas/"

ProxyPass        "/${NS}/auth/" "${KEYCLOAK_URL}/${NS}/auth/"
ProxyPassReverse "/${NS}/auth/" "${KEYCLOAK_URL}/${NS}/auth/"

ProxyPass        "/${NS}/atlas/atlas/" "${PYATLAS_URL}/api/atlas/"
ProxyPassReverse "/${NS}/atlas/atlas/" "${PYATLAS_URL}/api/atlas/"

ProxyPass        "/${NS}/atlas/repository/api/" "${PYATLAS_URL}/api/aurelius/repository/"
ProxyPass        "/${NS}/atlas/elastic"      "${PYATLAS_URL}/api/aurelius/search/atlas-dev"
ProxyPass        "/${NS}/atlas/data_quality" "${PYATLAS_URL}/api/aurelius/search/atlas-dev-quality"
ProxyPass        "/${NS}/atlas/gov_quality"  "${PYATLAS_URL}/api/aurelius/search/atlas-dev-gov-quality"
ProxyPass        "/${NS}/atlas/validate_entity" "${PYATLAS_URL}/api/aurelius/validate_entity"
ProxyPass        "/${NS}/atlas/lineage_model"   "${PYATLAS_URL}/api/aurelius/lineage_model"
ProxyPass        "/${NS}/atlas/lineage"         "${PYATLAS_URL}/api/aurelius/lineage"
ProxyPass        "/${NS}/atlas/api/data_governance_dashboard" "${PYATLAS_URL}/api/aurelius/data_governance_dashboard"

<Location "/${NS}/atlas2/">
    ProxyPass        "${PYATLAS_URL}/"
    ProxyPassReverse "${PYATLAS_URL}/"
    # pyatlas' session cookie (classic Atlas UI login) is scoped to its own prefix
    ProxyPassReverseCookiePath "/" "/${NS}/atlas2/"
</Location>

Alias "/${NS}/atlas" "/usr/local/apache2/atlas"
<Directory "/usr/local/apache2/atlas">
    Require all granted
    Options FollowSymLinks
    DirectoryIndex index.html
    RewriteEngine On
    RewriteBase "/${NS}/atlas/"
    RewriteRule "^index\.html$" - [L]
    RewriteCond "%{REQUEST_FILENAME}" !-f
    RewriteCond "%{REQUEST_FILENAME}" !-d
    RewriteRule . "/${NS}/atlas/index.html" [L]
    # the app shell must never be cached, the hashed bundles can be cached for long
    <FilesMatch "\.(js|css|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
</Directory>
