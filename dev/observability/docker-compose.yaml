name: aurelius-dev-observability

services:
    otel-collector:
        image: dhi.io/opentelemetry-collector:0-debian13-contrib
        command: ["--config=/etc/otelcol-contrib/config.yaml"]
        depends_on:
            loki:
                condition: service_started
            tempo:
                condition: service_healthy
        ports:
            - "4317:4317"
            - "4318:4318"
            - "9464:9464"
        volumes:
            - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

    prometheus:
        image: dhi.io/prometheus:3.13-debian13
        user: "65532"
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        command:
            - "--config.file=/etc/prometheus/prometheus.yaml"
            - "--storage.tsdb.path=/var/prometheus"
            - "--web.enable-otlp-receiver"
        healthcheck:
            test: ["CMD", "promtool", "check", "ready"]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - "9090:9090"
        volumes:
            - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
            - prometheus-data:/var/prometheus

    loki:
        image: dhi.io/loki:3-debian13
        user: "65532"
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        command: ["-config.file=/etc/loki/config.yaml"]
        ports:
            - "3100:3100"
        volumes:
            - ./config/loki.yaml:/etc/loki/config.yaml:ro
            - loki-data:/loki

    tempo:
        image: dhi.io/tempo:3-debian13
        user: "65532"
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        command: ["-config.file=/etc/tempo/config.yaml"]
        healthcheck:
            test: ["CMD", "/opt/tempo/tempo", "-health"]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - "3200:3200"
        volumes:
            - ./config/tempo.yaml:/etc/tempo/config.yaml:ro
            - tempo-data:/var/tempo

    grafana:
        image: dhi.io/grafana:13-debian13
        user: "65532"
        depends_on:
            loki:
                condition: service_started
            prometheus:
                condition: service_healthy
            tempo:
                condition: service_healthy
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
            - GF_AUTH_DISABLE_LOGIN_FORM=true
            - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
            - GF_PATHS_DATA=/var/lib/grafana/data
            - GF_PATHS_LOGS=/var/lib/grafana/logs
            - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
        ports:
            - "127.0.0.1:3000:3000"
        volumes:
            - ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
            - ./config/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
            - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana-data:/var/lib/grafana

networks:
    default:
        name: aurelius-dev-observability-network

volumes:
    grafana-data:
    loki-data:
    prometheus-data:
    tempo-data:
