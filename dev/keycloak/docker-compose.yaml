name: aurelius-dev-keycloak

services:
    keycloak:
        image: dhi.io/keycloak:26-debian13
        command:
            [
                "start-dev",
                "--import-realm",
                "--http-relative-path=/",
                "-Djgroups.dns.query=keycloak-rss",
                "--features=opentelemetry-metrics,preview",
                "--metrics-enabled=true",
                "--tracing-enabled=true",
                "--telemetry-metrics-enabled=true",
                "--telemetry-logs-enabled=true",
                "--telemetry-endpoint=http://otel-collector:4317",
            ]
        depends_on:
            postgres-keycloak:
                condition: service_healthy
        environment:
            KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
            KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
            KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USERNAME}
            KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
            KC_HEALTH_ENABLED: true
            KC_HOSTNAME: keycloak.localhost
            # OpenTelemetry native configuration
            OTEL_SERVICE_NAME: keycloak
            OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
            OTEL_TRACES_SAMPLER: parentbased_traceidratio
            OTEL_TRACES_SAMPLER_ARG: "0.1"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | sed -n '/\"status\":\"UP\"/q' || exit 1",
                ]
            interval: 15s
            timeout: 10s
            retries: 20
            start_period: 180s
        ports:
            - 8080:8080
        volumes:
            - ./import:/opt/keycloak/data/import:ro
        networks:
            - default
            - observability

    postgres-keycloak:
        image: dhi.io/postgres:18-alpine3.23
        environment:
            POSTGRES_USER: ${KEYCLOAK_DATABASE_USERNAME}
            POSTGRES_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
            POSTGRES_DB: keycloak
            POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        stop_signal: SIGINT
        healthcheck:
            test: ["CMD-SHELL", "pg_isready", "-d", "keycloak"]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - 5432
        volumes:
            - data:/var/lib/postgresql

networks:
    default:
        name: aurelius-dev-keycloak-network
    observability:
        name: aurelius-dev-observability-network
        external: true

volumes:
    data:
