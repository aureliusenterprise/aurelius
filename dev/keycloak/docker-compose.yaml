name: aurelius-dev-keycloak

services:
    keycloak:
        image: keycloak/keycloak:latest
        command: ["start-dev", "--import-realm"]
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
            KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
            KC_DB_USERNAME: ${DATABASE_USERNAME}
            KC_DB_PASSWORD: ${DATABASE_PASSWORD}
            KC_HEALTH_ENABLED: true
            KC_HOSTNAME: keycloak.localhost
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
                ]
            interval: 30s
            timeout: 5s
            retries: 5
        ports:
            - 8080:8080
        volumes:
            - ./import:/opt/keycloak/data/import:ro

    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: ${DATABASE_USERNAME}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
            POSTGRES_DB: keycloak
        healthcheck:
            test: ["CMD-SHELL", "pg_isready", "-d", "keycloak"]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - 5432
        volumes:
            - data:/var/lib/postgresql

networks:
    default:
        name: aurelius-dev-keycloak-network

volumes:
    data:
