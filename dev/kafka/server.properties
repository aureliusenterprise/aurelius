############################# Server Basics #############################
broker.id=1
process.roles=broker,controller

############################# Socket Server Settings #############################
listeners=PLAINTEXT://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093,LOCAL://0.0.0.0:9092
advertised.listeners=PLAINTEXT://broker:9094,LOCAL://localhost:9092
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,LOCAL:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

############################# KRaft Settings #############################
controller.listener.names=CONTROLLER
controller.quorum.voters=1@localhost:9093

############################# Log Basics #############################
log.dirs=/opt/kafka/logs
num.partitions=3
message.max.bytes=10000000
socket.request.max.bytes=104857600

############################# Replication #############################
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
default.replication.factor=1

############################# Group Coordinator Settings #############################
group.initial.rebalance.delay.ms=0
