name: Scan

on:
    schedule:
        - cron: "0 2 * * *"

env:
    SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}

jobs:
    test:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  java: "true"
                  python: "true"
                  node: "true"
                  dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Playwright
              run: uv run playwright install --with-deps

            - name: Test all projects
              run: npx nx run-many -t test e2e -c ci

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-reports
                  path: |
                      **/coverage.xml
                      **/jacocoTestReport.xml
                      **/lcov.info

    build-and-scan:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  java: "true"
                  python: "true"
                  node: "true"
                  dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Cosign
              uses: sigstore/cosign-installer@v4.1.1

            - name: Install CycloneDX CLI
              run: |
                  curl -sSfL https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-x64 -o /usr/local/bin/cyclonedx
                  chmod +x /usr/local/bin/cyclonedx

            - name: Install Trivy
              uses: aquasecurity/setup-trivy@v0.2.6

            - name: Build all docker images
              run: npx nx run-many -t docker-build

            - name: Generate vulnerability reports
              run: npx nx run-many -t docker-vuln-scan -c sarif

            - name: Upload vulnerability reports
              uses: actions/upload-artifact@v7
              with:
                  name: vuln-reports
                  path: "**/vulnerabilities.sarif"

    sonar:
        runs-on: ubuntu-latest
        needs: [test, build-and-scan]

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  node: "true"

            - name: Download coverage reports
              uses: actions/download-artifact@v8
              with:
                  name: coverage-reports

            - name: Download vulnerability reports
              uses: actions/download-artifact@v8
              with:
                  name: vuln-reports

            - name: Install SonarQube scanner
              env:
                  SONAR_VERSION: 8.0.1.6346
                  SONAR_ROOT: ${{ runner.temp }}/sonar-scanner
                  SONAR_ZIP: /tmp/sonar-scanner.zip
              run: |
                  curl -o "$SONAR_ZIP" -L "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_VERSION-linux-x64.zip"
                  unzip -o "$SONAR_ZIP" -d "$SONAR_ROOT"
                  rm "$SONAR_ZIP"
                  echo "$SONAR_ROOT/sonar-scanner-$SONAR_VERSION-linux-x64/bin" >> "$GITHUB_PATH"
                  "$SONAR_ROOT/sonar-scanner-$SONAR_VERSION-linux-x64/bin/sonar-scanner" --version

            - name: Decrypt secrets for SonarQube
              run: npx nx run-many -t decrypt

            - name: Run SonarQube analysis
              run: npx nx run-many -t sonar
