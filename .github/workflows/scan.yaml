name: Scan

on:
    schedule:
        - cron: "0 2 * * *"

permissions:
    actions: read
    contents: read
    packages: read

env:
    SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}

jobs:
    scan:
        runs-on: ubuntu-latest

        steps:
            - name: Install SOPS
              env:
                  SOPS_VERSION: v3.11.0
              run: |
                  curl -LO https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64
                  sudo mv sops-${SOPS_VERSION}.linux.amd64 /usr/local/bin/sops
                  sudo chmod +x /usr/local/bin/sops

            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up JDK 21 for x64
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  architecture: x64

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: 3.14

            - name: Install uv
              run: python -m pip install uv

            - name: Cache the virtualenv
              uses: actions/cache@v4
              with:
                  path: ./.venv
                  key: ${{ runner.os }}-venv-${{ hashFiles('**/uv.lock') }}

            - name: Install Python dependencies
              run: uv venv --allow-existing && uv sync

            - name: Expose GitHub Runtime
              uses: crazy-max/ghaction-github-runtime@v3

            - name: Update GITHUB_PATH
              run: echo "$(uv python find)" >> $GITHUB_PATH

            - name: Setup Node.js and dependencies
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install Node.js dependencies
              run: npm install

            - name: Install SonarQube scanner
              env:
                  SONAR_VERSION: 8.0.1.6346
                  SONAR_ROOT: ${{ runner.temp }}/sonar-scanner
                  SONAR_ZIP: /tmp/sonar-scanner.zip
              run: |
                  curl -o "$SONAR_ZIP" -L "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_VERSION-linux-x64.zip"
                  unzip -o "$SONAR_ZIP" -d "$SONAR_ROOT"
                  rm "$SONAR_ZIP"
                  echo "$SONAR_ROOT/sonar-scanner-$SONAR_VERSION-linux-x64/bin" >> "$GITHUB_PATH"
                  "$SONAR_ROOT/sonar-scanner-$SONAR_VERSION-linux-x64/bin/sonar-scanner" --version

            - name: Install Cosign
              uses: sigstore/cosign-installer@v4.1.1

            - name: Install CycloneDX CLI
              run: |
                  curl -sSfL https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-x64 -o /usr/local/bin/cyclonedx
                  chmod +x /usr/local/bin/cyclonedx

            - name: Install Trivy
              uses: aquasecurity/setup-trivy@v0.2.6

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  registry: docker.io
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Log in to the GitHub Container registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build all docker images
              run: npx nx run-many -t docker-build

            - name: Generate vulnerability reports
              run: npx nx run-many -t docker-vuln-scan -c sarif

            - name: Run SonarQube analysis
              run: npx nx run-many -t sonar
