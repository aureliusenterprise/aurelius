name: Publish Documentation (Main)

concurrency:
    group: "docs"

on:
    push:
        branches:
            - main

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - run: git config --global user.email "info@aureliusenterprise.com"
            - run: git config --global user.name "Aurelius Enterprise"

            - uses: actions/setup-python@v5
              with:
                  python-version: 3.13

            - name: Install uv
              run: python -m pip install uv

            - name: Cache the virtualenv
              uses: actions/cache@v4
              with:
                  path: ./.venv
                  key: ${{ runner.os }}-venv-${{ hashFiles('**/uv.lock') }}

            - name: Install Python dependencies
              run: uv venv --allow-existing && uv sync

            - name: Publish documentation for main branch
              run: |
                  REF_NAME=${{ github.ref_name }}
                  SANITIZED_REF_NAME=${REF_NAME//"/"/"-"}
                  uv run mike deploy -b public-docs --push $SANITIZED_REF_NAME
              shell: bash
