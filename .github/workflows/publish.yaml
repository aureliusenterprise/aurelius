name: Publish Containers

on:
    push:
        tags:
            - v*.*.*

permissions:
    contents: read
    id-token: write
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up JDK 21 for x64
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  architecture: x64

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: 3.14

            - name: Install uv
              run: python -m pip install uv

            - name: Cache the virtualenv
              uses: actions/cache@v4
              with:
                  path: ./.venv
                  key: ${{ runner.os }}-venv-${{ hashFiles('**/uv.lock') }}

            - name: Install Python dependencies
              run: uv venv --allow-existing && uv sync

            - name: Setup Node.js and dependencies
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  registry-url: "https://npm.pkg.github.com"

            - name: Install Node.js dependencies
              run: npm install

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  registry: docker.io
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Log in to the GitHub Container registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Cosign
              uses: sigstore/cosign-installer@v4.1.1

            - name: Publish containers
              run: npx nx run-many -t docker-publish -- --version ${{ github.ref_name }}

            - name: Attest containers
              run: npx nx run-many -t docker-attest -- --version ${{ github.ref_name }}

            - name: Sign containers
              run: npx nx run-many -t docker-sign -- --version ${{ github.ref_name }}

            - name: Verify container signatures
              run: >
                  npx nx run-many -t docker-verify -- --version ${{ github.ref_name }}
                  --identity "^https://github\.com/${{ github.repository_owner }}/project-template/\.github/workflows/publish\.yaml@${{ github.ref }}$"
                  --issuer "^https://token\.actions\.githubusercontent\.com$"
