name: Publish Containers

on:
    push:
        tags:
            - v*.*.*

permissions:
    contents: read
    id-token: write
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  java: "true"
                  python: "true"
                  node: "true"
                  dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Cosign
              uses: sigstore/cosign-installer@v4.1.1

            - name: Install CycloneDX CLI
              run: |
                  curl -sSfL https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-x64 -o /usr/local/bin/cyclonedx
                  chmod +x /usr/local/bin/cyclonedx

            - name: Install Trivy
              uses: aquasecurity/setup-trivy@v0.2.6

            - name: Publish containers
              run: npx nx run-many -t docker-publish -- --version ${{ github.ref_name }}

            - name: Attest containers
              run: npx nx run-many -t docker-attest -- --version ${{ github.ref_name }}

            - name: Sign containers
              run: npx nx run-many -t docker-sign -- --version ${{ github.ref_name }}

            - name: Verify container signatures
              run: >
                  npx nx run-many -t docker-verify -- --version ${{ github.ref_name }}
                  --identity "^https://github\.com/${{ github.repository_owner }}/project-template/\.github/workflows/publish\.yaml@${{ github.ref }}$"
                  --issuer "^https://token\.actions\.githubusercontent\.com$"
