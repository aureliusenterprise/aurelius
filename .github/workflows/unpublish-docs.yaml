name: Delete Documentation

concurrency:
    group: "docs"

on: delete

env:
    POETRY_VIRTUALENVS_IN_PROJECT: true

jobs:
    delete_docs:
        if: |
            github.event.ref_type =='branch'

        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - run: git config --global user.email "info@aureliusenterprise.com"
            - run: git config --global user.name "Aurelius Enterprise"

            - uses: actions/setup-python@v5
              with:
                  python-version: 3.13

            - name: Install poetry
              run: python -m pip install poetry

            - name: Cache the virtualenv
              uses: actions/cache@v4
              with:
                  path: ./.venv
                  key: ${{ runner.os }}-venv-${{ hashFiles('**/poetry.lock') }}

            - run: poetry install

            - name: Check if documentation exists for the deleted branch
              id: check_docs
              run: |
                  REF_NAME=${{ github.event.ref }}
                  SANITIZED_REF_NAME=${REF_NAME//"/"/"-"}
                  poetry run mike list -b public-docs | grep -q $SANITIZED_REF_NAME && exists=true || exists=false
                  echo "exists=$exists" >> "$GITHUB_OUTPUT"
              shell: bash

            - name: Delete documentation if it exists
              if: steps.check_docs.outputs.exists == 'true'
              run: |
                  REF_NAME=${{ github.event.ref }}
                  SANITIZED_REF_NAME=${REF_NAME//"/"/"-"}
                  poetry run mike delete -b public-docs --push $SANITIZED_REF_NAME
              shell: bash
