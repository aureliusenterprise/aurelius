name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

env:
    SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}

jobs:
    validate:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  python: "true"
                  node: "true"

            - name: Run pre-commit hooks
              uses: pre-commit/action@v3.0.1

    test:
        runs-on: ubuntu-latest
        needs: validate

        permissions:
            actions: read
            contents: read
            packages: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  python: "true"
                  node: "true"
                  playwright: "true"
                  dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set SHA for affected commands
              uses: nrwl/nx-set-shas@v5

            - name: Test affected projects
              run: npx nx affected -t test e2e -c ci

            - name: Check that every function and rule is named by a test (ADR 049)
              run: npx nx check aurelius-atlas-test-report

            - name: Render the test report
              if: always()
              run: npx nx render aurelius-atlas-test-report

            - name: Upload the test report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test-report
                  path: reports/aurelius-atlas-test-report/dist/
                  if-no-files-found: warn

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-reports
                  path: |
                      **/coverage.xml
                      **/jacocoTestReport.xml
                      **/lcov.info
                  if-no-files-found: ignore

            - name: Collect failure diagnostics
              if: failure()
              run: |
                  mkdir -p reports/failure-diagnostics
                  docker ps --all --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" \
                    > reports/failure-diagnostics/container-status.txt 2>&1 || true
                  for project in $(docker compose ls --all -q); do
                    echo "Collecting logs for project: $project"
                    docker compose --project-name "$project" logs --no-color \
                      > "reports/failure-diagnostics/${project}-logs.txt" 2>&1 || true
                  done

            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-failure-diagnostics
                  path: reports/failure-diagnostics/
                  retention-days: 30

    build-and-scan:
        runs-on: ubuntu-latest
        needs: validate

        permissions:
            actions: read
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  python: "true"
                  node: "true"
                  cosign: "true"
                  trivy: "true"
                  cyclonedx: "true"
                  dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set SHA for affected commands
              uses: nrwl/nx-set-shas@v5

            - name: Build docker images for affected projects
              run: npx nx affected -t docker-build -c ci

            - name: Generate vulnerability reports for affected projects
              run: npx nx affected -t docker-vuln-scan -c sarif

            - name: Upload vulnerability reports
              uses: actions/upload-artifact@v7
              with:
                  name: vuln-reports
                  path: "**/vulnerabilities.sarif"
                  if-no-files-found: ignore

    sonar:
        runs-on: ubuntu-latest
        needs: [test, build-and-scan]

        permissions:
            actions: read
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  sops: "true"
                  node: "true"
                  sonarqube: "true"

            - name: Download coverage reports
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  name: coverage-reports

            - name: Download vulnerability reports
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  name: vuln-reports

            - name: Set SHA for affected commands
              uses: nrwl/nx-set-shas@v5

            - name: Decrypt secrets for SonarQube
              run: npx nx affected -t decrypt

            - name: Run SonarQube analysis
              run: npx nx affected -t sonar
