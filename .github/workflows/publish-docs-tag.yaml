name: Publish Documentation (Tag)

concurrency:
    group: "docs"

on:
    push:
        tags:
            - v*.*.*

env:
    POETRY_VIRTUALENVS_IN_PROJECT: true

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - run: git config --global user.email "info@aureliusenterprise.com"
            - run: git config --global user.name "Aurelius Enterprise"

            - uses: actions/setup-python@v5
              with:
                  python-version: 3.13

            - name: Install poetry
              run: python -m pip install poetry

            - name: Cache the virtualenv
              uses: actions/cache@v4
              with:
                  path: ./.venv
                  key: ${{ runner.os }}-venv-${{ hashFiles('**/poetry.lock') }}

            - run: poetry install

            - name: Publish documentation for tag
              run: |
                  REF_NAME=${{ github.ref_name }}
                  SANITIZED_REF_NAME=${REF_NAME//"/"/"-"}
                  poetry run mike deploy -b public-docs --push $SANITIZED_REF_NAME
              shell: bash
