name: Setup Toolchain
description: Installs the runtimes and tools needed by CI jobs. Must be called after actions/checkout.

inputs:
    sops:
        description: Install SOPS
        default: "false"
    sops-version:
        description: SOPS version to install
        default: v3.11.0
    java:
        description: Set up JDK 21 and Gradle
        default: "false"
    python:
        description: Set up Python, uv, and install dependencies
        default: "false"
    node:
        description: Set up Node.js and install npm dependencies
        default: "false"
    dockerhub-username:
        description: Docker Hub username (leave empty to skip Docker Hub login)
        default: ""
    dockerhub-token:
        description: Docker Hub token
        default: ""
    github-token:
        description: GitHub token for GHCR login (leave empty to skip)
        default: ""

runs:
    using: composite
    steps:
        - name: Install SOPS
          if: inputs.sops == 'true'
          shell: bash
          env:
              SOPS_VERSION: ${{ inputs.sops-version }}
          run: |
              curl -LO https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64
              sudo mv sops-${SOPS_VERSION}.linux.amd64 /usr/local/bin/sops
              sudo chmod +x /usr/local/bin/sops

        - name: Set up JDK 21 for x64
          if: inputs.java == 'true'
          uses: actions/setup-java@v5
          with:
              java-version: "21"
              distribution: "temurin"
              architecture: x64

        - name: Setup Gradle
          if: inputs.java == 'true'
          uses: gradle/actions/setup-gradle@v5

        - name: Setup Python
          if: inputs.python == 'true'
          uses: actions/setup-python@v6
          with:
              python-version: 3.14

        - name: Install uv
          if: inputs.python == 'true'
          shell: bash
          run: python -m pip install uv

        - name: Cache the virtualenv
          if: inputs.python == 'true'
          uses: actions/cache@v5
          with:
              path: ./.venv
              key: ${{ runner.os }}-venv-${{ hashFiles('**/uv.lock') }}

        - name: Install Python dependencies
          if: inputs.python == 'true'
          shell: bash
          run: uv venv --allow-existing && uv sync

        - name: Expose GitHub Runtime
          if: inputs.python == 'true'
          uses: crazy-max/ghaction-github-runtime@v4

        - name: Update GITHUB_PATH
          if: inputs.python == 'true'
          shell: bash
          run: echo "$(uv python find)" >> $GITHUB_PATH

        - name: Setup Node.js and dependencies
          if: inputs.node == 'true'
          uses: actions/setup-node@v6
          with:
              node-version: 24
              cache: npm

        - name: Install Node.js dependencies
          if: inputs.node == 'true'
          shell: bash
          run: npm install

        - name: Log in to Docker Hub
          if: inputs.dockerhub-username != ''
          uses: docker/login-action@v4
          with:
              registry: docker.io
              username: ${{ inputs.dockerhub-username }}
              password: ${{ inputs.dockerhub-token }}

        - name: Log in to the GitHub Container registry
          if: inputs.github-token != ''
          uses: docker/login-action@v4
          with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ inputs.github-token }}
