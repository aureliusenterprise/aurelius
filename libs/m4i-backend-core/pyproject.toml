[tool.poetry]
authors = ["Aurelius Enterprise <info@aureliusenterprise.com>"]
description = "Shared code for the M4I backend"
license = 'UNLICENSED'
name = "m4i-backend-core"
readme = 'README.md'
version = "1.0.0"

[[tool.poetry.packages]]
include = "m4i_backend_core"

[tool.poetry.dependencies]
cachetools = ">=5.5,<7"
cryptography = ">=44.0,<47"
flask = ">=3.0,<4.0"
pyjwt = ">=2.9.0"
python = ">=3.11,<3.14"
requests = ">=2.32.0"
tenacity = ">=8.5.0"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]
