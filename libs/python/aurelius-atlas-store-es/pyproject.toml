[project]
dependencies = ["elasticsearch[async]>=9.1,<10", "pydantic>=2.13.5"]
description = "Elasticsearch 9 access for Aurelius Atlas: settings, client, index naming."
name = "aurelius-atlas-store-es"
requires-python = ">=3.14"
version = "0.6.0"

[project.optional-dependencies]
testing = ["httpx>=0.28.1", "testcontainers>=4.15.0"]

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_store_es"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
markers = [
    "component: needs Docker; runs against a real Elasticsearch node",
    "covers(target, rules=None): the function (dotted path) and rule ids this test proves",
]
required_plugins = ["pytest-asyncio"]

[tool.coverage.run]
branch = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
