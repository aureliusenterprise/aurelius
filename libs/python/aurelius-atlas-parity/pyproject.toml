[project]
dependencies = ["httpx>=0.28.1", "pydantic>=2.13.5", "pytest>=8.4.1", "pyyaml>=6.0.2"]
description = "Parity testing for Aurelius Atlas: scenarios, recording the reference, normalising and comparing."
name = "aurelius-atlas-parity"
requires-python = ">=3.14"
version = "0.6.0"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_atlas_parity"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]

[tool.coverage.run]
branch = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
