[tool.nx]
autoActivate = true

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

[tool.poetry.dependencies.aurelius-license-report]
develop = true
path = "reports/aurelius-license-report"

[tool.poetry.dependencies.aurelius-vulnerability-report]
develop = true
path = "reports/aurelius-vulnerability-report"

[tool.poetry.dependencies.data2model]
develop = true
path = "backend/m4i-data2model"

[tool.poetry.dependencies.m4i-analytics]
develop = true
path = "libs/m4i-analytics"

[tool.poetry.dependencies.m4i-atlas-core]
develop = true
path = "libs/m4i-atlas-core"

[tool.poetry.dependencies.m4i-data-management]
develop = true
path = "libs/m4i-data-management"

[tool.poetry.dependencies.m4i-governance-data-quality]
develop = true
path = "libs/m4i-governance-data-quality"

[tool.poetry.dependencies.m4i-backend-core]
develop = true
path = "libs/m4i-backend-core"

[tool.poetry.dependencies.m4i-consistency-metrics]
develop = true
path = "backend/m4i-consistency-metrics"

[tool.poetry.dependencies.m4i-data-dictionary-io]
develop = true
path = "apps/m4i-data-dictionary-io"

[tool.poetry.dependencies.m4i-flink-tasks]
develop = true
path = "libs/m4i-flink-tasks"

[tool.poetry.dependencies.m4i-publish-state]
develop = true
path = "backend/m4i-publish-state"

[tool.poetry.dependencies.m4i-synchronize-app-search]
develop = true
path = "backend/m4i-synchronize-app-search"

[tool.poetry.dependencies.m4i-update-gov-data-quality]
develop = true
path = "backend/m4i-update-gov-data-quality"

[tool.poetry.dependencies.m4i-lineage-rest-api]
develop = true
path = "backend/m4i-lineage-rest-api"

[tool.poetry.dependencies.m4i-graphviz-layouts]
develop = true
path = "libs/m4i-analytics-extensions/m4i-graphviz-layouts"

[tool.poetry.dependencies.m4i-lineage-model]
develop = true
path = "backend/m4i-lineage-model"

[tool.poetry.dependencies.m4i-metrics]
develop = true
path = "libs/m4i-metrics"

[tool.poetry.dependencies.m4i-search-api]
develop = true
path = "backend/m4i-search-api"

[tool.poetry.dependencies.m4i-validate-entity]
develop = true
path = "backend/m4i-validate-entity"

[tool.poetry.dependencies.m4i-atlas-post-install]
develop = true
path = "backend/m4i-atlas-post-install"

[tool.poetry.group.dev.dependencies]
autopep8 = ">=2.0,<3"
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.6,<10"
mkdocs-print-site-plugin = ">=2.7,<3"
pre-commit = "^4.0"
pydantic = ">=2.10.0"
pydantic-avro = ">=0.6,<1"
pydantic-settings = ">=2.6.0"
pyright = "^1.1.403"
pytest = "^8.0"
pytest-asyncio = "^1.3"
pytest-cov = "^7.0"
pytest-sugar = ">=0.9,<2"
python-dotenv = ">=1.0,<2"
responses = "^0.26"
ruff = "^0.15"
tenacity = ">=8.5.0"
testcontainers = "^4.0"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core==1.1.0"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
