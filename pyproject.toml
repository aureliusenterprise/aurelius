[project]
name = "aurelius-atlas"
readme = "docs/README.md"
requires-python = ">=3.14"
version = "0.6.0"

[[project.authors]]
name = "Aurelius Enterprise"

[dependency-groups]
dev = [
    "aurelius-atlas-store-es[testing]",
    "aurelius-example",
    "aurelius-fastapi-example",
    "aurelius-license-report",
    "aurelius-sdk[full]",
    "aurelius-vulnerability-report",
    "alembic>=1.18",
    "mike",
    "mkdocstrings>=1.0",
    "mkdocstrings-python>=2.0",
    "playwright>=1.56.0",
    "pre-commit>=4.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.11.7",
    "pydantic-avro>=0.9.0",
    "pydantic-settings>=2.10.1",
    "pymdown-extensions>=10.21.3",
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "pytest-playwright>=0.8.0",
    "pytest-sugar>=1.0.0",
    "python-dotenv>=1.2.2",
    "python-keycloak>=7.1",
    "ruff>=0.15.16",
    "sqlalchemy>=2.0.41",
    "sqlmodel>=0.0.24",
    "tenacity>=9.1.2",
    "testcontainers>=4.14",
    "timeout-decorator>=0.5.0",
    "zensical>=0.0.68",
    "griffe-pydantic>=1.3.2",
]

[tool.uv.sources]
# Zensical-compatible mike fork; not published on PyPI, must be installed from GitHub.
mike = { git = "https://github.com/squidfunk/mike.git" }

[tool.pyright]
exclude = [".venv"]
pythonVersion = "3.14"
reportUnnecessaryTypeIgnoreComment = "error"
typeCheckingMode = "standard"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
log_format = "%(message)s"
log_level = "INFO"
required_plugins = ["pytest-asyncio"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
ignore = [
    "COM812",
    "CPY001",
    "D100",
    "D104",
    "D105",
    "D212",
    "D107",
    "LOG015",
    "S311",
    "FIX002",
    "PT001",
    "TC001",
    "TC002",
    "TC003",
]
select = ["ALL"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "sqlalchemy.orm.DeclarativeBase"]
runtime-evaluated-decorators = ["pydantic.validate_call", "attrs.define"]

[tool.ruff.lint.per-file-ignores]
"**/conftest.py" = ["INP001"]
"**/test__*.py" = ["INP001", "S101", "PLR0913", "PLR2004"]
"tools/griffe/*.py" = ["INP001", "ANN401", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.sources.aurelius-atlas-store-es]
workspace = true

[tool.uv.sources.aurelius-example]
workspace = true

[tool.uv.sources.aurelius-fastapi-example]
workspace = true

[tool.uv.sources.aurelius-license-report]
workspace = true

[tool.uv.sources.aurelius-sdk]
workspace = true

[tool.uv.sources.aurelius-vulnerability-report]
workspace = true

[tool.uv.workspace]
members = [
    "libs/python/aurelius-atlas-store-es",
    "apps/aurelius-fastapi-example",
    "libs/python/aurelius-example",
    "libs/python/aurelius-sdk",
    "reports/aurelius-license-report",
    "reports/aurelius-vulnerability-report",
]
