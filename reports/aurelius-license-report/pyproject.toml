[project]
dependencies = ["jinja2>=3.1.6", "pydantic>=2.13.5", "pydantic-settings>=2.15.0"]
description = "This report provides license analysis information for Aurelius projects."
name = "aurelius-license-report"
requires-python = ">=3.14"
version = "0.0.0"

[[project.authors]]
name = "Aurelius Enterprise"

[tool.hatch.build.targets.wheel]
packages = ["aurelius_license_report"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
