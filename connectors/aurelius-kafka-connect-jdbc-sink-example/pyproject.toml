[tool.poetry]
authors = ["Aurelius Enterprise <info@aureliusenterprise.com>"]
description = "This is an example Kafka Connect JDBC Sink application."
name = "aurelius-kafka-connect-jdbc-sink-example"
version = "0.0.0"

[[tool.poetry.packages]]
include = "aurelius_kafka_connect_jdbc_sink_example"

[tool.poetry.dependencies]
pydantic = "^2.11.7"
pydantic-avro = "^0.9.0"
python = "^3.13"
sqlmodel = "^0.0.24"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
log_format = "%(message)s"
log_level = "INFO"
required_plugins = ["pytest-asyncio"]

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]
