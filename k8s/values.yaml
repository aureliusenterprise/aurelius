---
# Aurelius on pyatlas, one installation for several tenants (organisations).
#
#   https://<external_hostname>/<namespace>/<tenant>/atlas/     frontend of a tenant
#   https://<external_hostname>/<namespace>/<tenant>/kibana/    Kibana space of a tenant (its ROLE_ADMIN users)
#   https://<external_hostname>/<namespace>/platform/kibana/    Kibana over all tenants (operators)
#   https://<external_hostname>/<namespace>/auth/admin/         Keycloak admin console (one realm per tenant)
#
# The URL prefix <namespace> is the Kubernetes namespace of the release.  Tenants are created with
#   kubectl -n <namespace> exec deploy/aurelius-admin -- aurelius-admin tenant create acme --name "ACME" --admin-user anna
# (see README.md "Tenants").  Secrets are generated at the first installation and kept on upgrades.

global:
    # host name of the ingress (the URL the browser uses)
    external_hostname: 'azure.aurelius-atlas.com'
    # tag of the Aurelius images (ghcr.io/aureliusenterprise/pyatlas, aurelius-reverse-proxy,
    # aurelius-docker-keycloak)
    version: v4.0.0-alpha
    imageRegistry: ghcr.io/aureliusenterprise
    # tenant of the old single-tenant URLs (/<namespace>/atlas/, /<namespace>/lin_api/, ...) and of requests
    # without a tenant; created at installation with the realm m4i of the keycloak chart
    defaultTenant: m4i
    defaultTenantName: M4I
    imagePullSecrets:
      - ghcr

# the default tenant gets the Aurelius sample data (entities, quality results) on its first start
sampleData: true

# Keycloak (all settings: charts/keycloak/values.yaml)
keycloak:
    # image; the tag is global.version (does not follow global.imageRegistry)
    repository: ghcr.io/aureliusenterprise/aurelius-docker-keycloak
    # realm of the default tenant, imported at the first start (file in charts/keycloak/realms/)
    realm_file_name: 'realm_m4i.json'
    replicaCount: 1
    # Keycloak's own database
    postgresql:
        enabled: true
        persistence:
            accessMode: ReadWriteOnce
            size: 2Gi
            # storageClass: managed-csi
        # use a database outside the chart instead (postgresql.enabled: false):
        # external:
        #     host: my-postgres.example.com
        #     port: 5432
        #     database: keycloak
        #     existingSecret: keycloak-db   # keys: username, password

# pyatlas (templates/pyatlas.yaml)
pyatlas:
    replicaCount: 1
    # contexts of tenants without requests are stopped after this many seconds
    tenantIdleSecs: 1800
    resources:
        requests: { cpu: 250m, memory: 768Mi }
        limits: { memory: 2Gi }

# reverse proxy with the frontend (all settings: charts/reverse-proxy/values.yaml)
reverse-proxy:
    replicaCount: 1

# Elasticsearch and Kibana through the ECK operator (installed separately, see README; charts/elastic/values.yaml)
elastic:
    elastic_search:
        replicaCount: 1
        version: 9.5.4
        persistence:
            enabled: true
            accessMode: ReadWriteOnce
            size: 8Gi
    kibana:
        replicaCount: 1
        version: 9.5.4

# log shipper (DaemonSet reading the container logs of pyatlas, proxy and Keycloak on every node; needs hostPath
# access to /var/log): log lines are routed to the data streams of their tenant
filebeat:
    enabled: true
    version: 9.5.4

# retention of the log data streams (days); logins and page views are kept 180 days (pyatlas)
logRetentionDays: 180

# a pod with the tenant administration (kubectl exec deploy/aurelius-admin -- aurelius-admin ...)
admin:
    enabled: true

ingress:
    # only used by the (commented) templates/prod_issuer.yaml
    email_address: andreas.wombacher@aureliusenterprise.com
    className: nginx
    clusterIssuer: letsencrypt-clusterissuer-aureliusdev
    tlsSecretName: letsencrypt-secret-aureliusdev

# only the reverse proxy (and the Aurelius jobs) may call pyatlas: pyatlas trusts the proxy's tenant header
networkPolicy:
    enabled: true
