{{- /* Generated once, kept on upgrades (lookup of the existing secret). */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "aurelius-secrets") | default dict }}
{{- $data := (get $existing "data") | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: aurelius-secrets
  labels:
    {{- include "aurelius.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "pyatlas-session-secret" "pyatlas-es-password" "filebeat-password" "proxy-crypto-passphrase" "operator-password" }}
  {{ $key }}: {{ (get $data $key) | default (randAlphaNum 40 | b64enc) | quote }}
  {{- end }}
