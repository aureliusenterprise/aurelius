# everything under /<namespace>/ goes to the reverse proxy (tenants, Keycloak, Kibana); a customer's own host name
# can be added as another rule that rewrites to /<namespace>/<tenant>/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reverse-proxy-ingress
  labels:
    {{- include "aurelius.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    cert-manager-io/http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    # import ZIPs up to pyatlas' limit
    nginx.ingress.kubernetes.io/proxy-body-size: 512m
    # Keycloak's redirects carry several large session cookies (plus legacy copies): more than nginx's default
    # 4k response header buffer, which nginx answers with 502 Bad Gateway
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.global.external_hostname }}
      http:
        paths:
          - pathType: Prefix
            path: /{{ .Release.Namespace }}
            backend:
              service:
                name: reverse-proxy
                port:
                  number: 80
  tls:
    - hosts:
        - {{ .Values.global.external_hostname }}
      secretName: {{ .Values.ingress.tlsSecretName }}
