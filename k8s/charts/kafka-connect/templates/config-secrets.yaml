apiVersion: v1
kind: Secret
metadata:
  name: {{ template "kafka-connect.fullname" . }}-secrets
  labels:
    app: {{ template "kafka-connect.name" . }}
    chart: {{ template "kafka-connect.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
type: Opaque
data:
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "kafka-connect.fullname" .))) | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  # Precedence: explicit value, then the existing Secret, then a fresh random
  # value. Reusing the existing Secret is what keeps an upgrade from rotating
  # the password away from the keystore/truststore already created by the
  # running connectors; an explicitly configured value still wins so it can be
  # changed deliberately.
  {{- if .Values.customEnv.CONFIG_ELASTIC_KEY_PASSWORD }}
  config-elastic-key-password: {{ .Values.customEnv.CONFIG_ELASTIC_KEY_PASSWORD | b64enc }}
  {{- else if hasKey $secretData "config-elastic-key-password" }}
  config-elastic-key-password: {{ index $secretData "config-elastic-key-password" }}
  {{- else }}
  config-elastic-key-password: {{ randAlphaNum 16 | b64enc }}
  {{- end }}
  {{- if .Values.customEnv.CONFIG_ELASTIC_KEYSTORE_PASSWORD }}
  config-keystore-password: {{ .Values.customEnv.CONFIG_ELASTIC_KEYSTORE_PASSWORD | b64enc }}
  {{- else if hasKey $secretData "config-keystore-password" }}
  config-keystore-password: {{ index $secretData "config-keystore-password" }}
  {{- else }}
  config-keystore-password: {{ randAlphaNum 16 | b64enc }}
  {{- end }}
