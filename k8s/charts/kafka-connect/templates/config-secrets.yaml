apiVersion: v1
kind: Secret
metadata:
  name: {{ template "kafka-connect.fullname" . }}-secrets
  labels:
    app: {{ template "kafka-connect.name" . }}
    chart: {{ template "kafka-connect.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
type: Opaque
data:
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "kafka-connect.fullname" .))) | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  # Reuse the existing passwords on upgrade; a fresh random value every render
  # would desync the secret from the keystore/truststore already created by the
  # running connectors.
  config-elastic-key-password: {{ index $secretData "config-elastic-key-password" | default (.Values.customEnv.CONFIG_ELASTIC_KEY_PASSWORD | default (randAlphaNum 16) | b64enc) }}
  config-keystore-password: {{ index $secretData "config-keystore-password" | default (.Values.customEnv.CONFIG_ELASTIC_KEYSTORE_PASSWORD | default (randAlphaNum 16) | b64enc) }}
