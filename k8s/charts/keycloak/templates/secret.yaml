apiVersion: v1
kind: Secret
metadata:
  name: "keycloak-secret"
  annotations:
    # kept by "helm uninstall" like the Keycloak database, whose admin user has this password
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace "keycloak-secret") | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  # Admin username for Keycloak 22+
  {{- if hasKey $secretData "admin-username" }}
  admin-username: {{ index $secretData "admin-username" }}
  {{- else }}
  admin-username: {{ "admin" | b64enc }}
  {{- end }}
  # Admin password: generated once, then kept (Keycloak reads it only when it creates its database, so it must never
  # change on an upgrade)
  {{- if hasKey $secretData "admin-password" }}
  admin-password: {{ index $secretData "admin-password" }}
  {{- else }}
  admin-password: {{ randAlphaNum 16 | b64enc }}
  {{- end }}
