apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "keycloak.fullname" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "keycloak.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "keycloak.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      hostname: keycloak
      subdomain: atlas
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        # Do not start Keycloak until Postgres accepts connections. Without this,
        # Keycloak can boot first after a node replacement, skip Liquibase
        # migrations and --import-realm against an unreachable DB, and serve
        # 403/500s from an empty schema.
        - name: wait-for-postgresql
          image: {{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
          command:
            - /bin/sh
            - -c
            # -U is required: this init container runs as the Keycloak uid (not
            # present in the postgres image's /etc/passwd), so libpq cannot
            # derive a username and pg_isready fails with rc=3 "no attempt".
            - until pg_isready -h {{ include "keycloak.fullname" . }}-postgresql -p 5432 -U {{ .Values.postgresql.globalVariables.POSTGRES_USER }}; do echo waiting for postgresql; sleep 2; done
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.repository }}:{{ .Values.global.version }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          command: ["/opt/keycloak/bin/kc.sh", "start-dev", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: admin-username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                    name: keycloak-secret
                    key: admin-password
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://{{ include "keycloak.fullname" . }}-postgresql:5432/{{ .Values.postgresql.globalVariables.POSTGRES_DB }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.fullname" . }}-postgresql-secret
                  key: postgres-username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.fullname" . }}-postgresql-secret
                  key: postgres-password
            - name: KC_LOG_LEVEL
              value: INFO
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: {{ .Values.global.external_hostname }}
            - name: KC_HTTP_RELATIVE_PATH
              value: /{{ .Release.Namespace }}/auth
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY
              value: edge
            - name: KC_HOSTNAME_STRICT
              value: "false"
          readinessProbe:
            httpGet:
              path: /{{ .Release.Namespace }}/auth/health/ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /{{ .Release.Namespace }}/auth/health/live
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: keycloak-secret-user-admin
            - secretRef:
                name: keycloak-secret-user-steward
            - secretRef:
                name: keycloak-secret-user-data
          volumeMounts:
            - name: realm-single-file-volume
              mountPath: /opt/keycloak/data/import/realm.json
              subPath: realm.json
      volumes:
        - name: realm-single-file-volume
          configMap:
            name: realm-single-file
