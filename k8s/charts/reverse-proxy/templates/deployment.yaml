{{- $ns := .Release.Namespace }}
{{- $public := printf "https://%s" .Values.global.external_hostname }}
{{- $pyatlasImage := printf "%s/pyatlas:%s" .Values.global.imageRegistry .Values.global.version }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reverse-proxy.fullname" . }}
  labels:
    {{- include "reverse-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "reverse-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reverse-proxy.selectorLabels" . | nindent 8 }}
        aurelius/pyatlas-client: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # the proxy's tenant files (Kibana login providers per realm, Kibana keys) come from the tenant registry:
      # written once before the proxy starts, then kept up to date by the tenant-sync sidecar
      initContainers:
        - name: tenant-sync-init
          image: {{ $pyatlasImage }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          # before the platform exists (first installation) the proxy starts without tenants
          command: ["sh", "-c", "aurelius-admin proxy sync || echo 'tenant registry not available yet'"]
          env:
            {{- include "reverse-proxy.syncEnv" . | nindent 12 }}
          volumeMounts:
            - { name: tenants, mountPath: /tenants }
      containers:
        - name: reverse-proxy
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image }}:{{ .Values.global.version }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AURELIUS_NS
              value: {{ $ns | quote }}
            - name: PUBLIC_URL
              value: {{ $public | quote }}
            - name: PYATLAS_URL
              value: "http://pyatlas:21000"
            - name: KEYCLOAK_URL
              value: "http://keycloak:8080"
            - name: KIBANA_URL
              value: "http://kibana-kb-http:5601"
            - name: DEFAULT_TENANT
              value: {{ .Values.global.defaultTenant | quote }}
            - name: TENANTS_DIR
              value: /usr/local/apache2/tenants
            - name: PROXY_CRYPTO_PASSPHRASE
              valueFrom:
                secretKeyRef: { name: aurelius-secrets, key: proxy-crypto-passphrase }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: tenants, mountPath: /usr/local/apache2/tenants, readOnly: true }
        - name: tenant-sync
          image: {{ $pyatlasImage }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          command: ["aurelius-admin", "proxy", "sync", "--loop", {{ .Values.tenantSyncSecs | quote }}]
          env:
            {{- include "reverse-proxy.syncEnv" . | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tenants, mountPath: /tenants }
      volumes:
        - name: tenants
          emptyDir: {}
