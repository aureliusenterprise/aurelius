---
# Reverse proxy of Aurelius with the Angular frontend (image built from docker/aurelius-reverse-proxy)
replicaCount: 1
image: aurelius-reverse-proxy
pullPolicy: IfNotPresent
service:
  name: reverse-proxy
  type: ClusterIP
  port: 80
  targetPort: 8080
# how often the tenant-sync sidecar reads the tenant registry (new tenants appear at the proxy after this long)
tenantSyncSecs: 30
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }
